DATASET: 'FourSeasonDataset'

DATA_PATH: '/space/userfiles/alyaqou1/det3d/data/fourseason/ImageSets/2023_late_summer_5min_balanced'
PATH_LIDAR : '/egr/research-canvas/four_seasons/dataset/2023_late_summer/oust'
PATH_LABEL: '/egr/research-canvas/detection3d_datasets/four_seasons/imerit_check/new_filtered_label3d/minpts_5/2023_late_summer'

DATA_PATH_T: '/space/userfiles/khatouna/SAM_IV_conference/data/LISA/snow/point_clouds'

POINT_CLOUD_RANGE: [-75.2, -75.2, -4, 75.2, 75.2, 2]

INFO_PATH: {
    'train': [fs_infos_train.pkl],
    'test': [fs_infos_val.pkl],
}


DATA_SPLIT: {
    'train': train,
    'test': val
}


SAMPLED_INTERVAL: {
    'train': 5,
    'test': 1
}

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['place_holder']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          GROUND_HEIGHT: -1.95
          DB_INFO_PATH:
              #- /home/hamed/FS2/data/fourseason/fs_dbinfos_train_sampled_1.pkl
              #- /space/userfiles/khatouna/OpenPCDet_FS/data/fourseason/fs_dbinfos_train_sampled_1.pkl
              - /space/userfiles/alyaqou1/det3d/data/fourseason/ImageSets/2023_late_summer_5min_balanced/fs_dbinfos_train_sampled_1.pkl
          PREPARE: {
             filter_by_min_points: ['Car:5', 'Pedestrian:5', 'Bike:5']
          }

          SAMPLE_GROUPS: ['Car:20','Pedestrian:15', 'Bike:15']
          NUM_POINT_FEATURES: 4
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.2, 0.2, 0.2]
          LIMIT_WHOLE_SCENE: True    

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.99, 1.01]

# 'intensity'
POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}


DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True
      REMOVE_OUTSIDE_FOV: True
      MIN_POINTS_OF_GT: 5

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.1, 0.1, 0.15]
      MAX_POINTS_PER_VOXEL: 5
      MAX_NUMBER_OF_VOXELS: {
        'train': 80000,
        'test': 90000
      }
